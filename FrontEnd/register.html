<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BlogNest — Future of Blogging</title>
    <meta name="description" content="Create your identity on the BlogNest AI blogging network.">

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cursor.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon.png">
</head>

<body>

    <div class="background-grid"></div>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div id="cursor-triangle"></div>

    <a href="index.html" class="back-home">
        <span>←</span> BACK TO BLOGNEST
    </a>

    <div style="position: absolute; top: 25px; right: 5vw; z-index: 10;">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
            ◐
        </button>
    </div>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <div class="auth-logo">
                    <div class="eyebrow" style="margin-bottom: 12px;">// NEW IDENTITY</div>
                    <h1>BLOG<span>NEST</span></h1>
                    <p>Create your identity in the BlogNest network.</p>
                </div>

                <form id="registerForm" class="auth-form" novalidate>

                    <div class="form-group">
                        <label for="name">FULL NAME / CALLSIGN</label>
                        <input
                            type="text"
                            id="name"
                            placeholder="Neo Anderson"
                            maxlength="100"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">EMAIL ADDRESS</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="neo@matrix.io"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">PASSWORD</label>
                        <input
                            type="password"
                            id="password"
                            placeholder="Minimum 6 characters"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >
                        <div class="form-help">Must contain at least 6 characters</div>
                    </div>

                    <div id="registerMessage" class="auth-message"></div>

                    <button type="submit" class="auth-button">
                        INITIALIZE ACCOUNT →
                    </button>

                </form>

                <div class="auth-footer">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>

            </div>

        </div>

    </main>

    <script src="js/loader.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/cursor.js"></script>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>

</body>
</html>
